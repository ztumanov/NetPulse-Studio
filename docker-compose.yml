services:
  netpulse-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: netpulse-studio:latest
    container_name: netpulse-studio
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
